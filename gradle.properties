# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Architectury Loom 1.11 requires Java 21+. Daemon JVM is selected by
# gradle/gradle-daemon-jvm.properties; this line helps toolchain auto-detection
# locate a JDK 21 install on Windows when JAVA_HOME points elsewhere.
org.gradle.java.installations.paths=C:/Program Files/Eclipse Adoptium/jdk-21.0.11.10-hotspot
org.gradle.java.installations.auto-download=true

# Mod properties
mod_version = 0.1.0
maven_group = com.supremecrafting
archives_name = supreme_crafting
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21.1

# Dependencies
architectury_api_version = 13.0.8
fabric_loader_version = 0.19.2
fabric_api_version = 0.116.11+1.21.1
neoforge_version = 21.1.228

# Recipe viewer integrations (3.x milestone). Optional at runtime.
emi_version = 1.1.22+1.21.1
jei_version = 19.27.0.340

# KubeJS — NeoForge-only (the project dropped Fabric support in 1.20+).
# Optional at runtime; recipe schema bindings come in step K2.
# 1.21.1 builds aren't on Latvian's own maven (which lags at 1.20.1 line);
# we pull from Modrinth Maven, which uses the full build-number version string.
# Rhino (Mozilla JS engine) is a hard dep of KubeJS, shipped as a separate jar.
kubejs_version = 2101.7.2-build.363
rhino_version = 2101.2.7-build.81+Rhino-1.21
# KubeJS transitive JIJ deps. Loom strips META-INF/jarjar/metadata.json
# during remap, so FML can't extract them in dev — we re-add them as real
# deps. Versions mirror what's bundled inside the kubejs jar at the version
# above; bump together when bumping kubejs_version.
kubejs_bat_version = 2101.1.0-build.1
kubejs_tinyserver_version = 1.0.0-build.33
kubejs_animatedgiflib_version = animated-gif-lib-1.7

# MouseTweaks — wheel-scroll / RMB-drag UX, multi-loader. From Modrinth.
# Different version strings per loader (latest 1.21.1 builds).
mouse_tweaks_fabric_version = 1.21-2.26-fabric
mouse_tweaks_neoforge_version = 1.21-2.26.1-neoforge

# Jade — block-info HUD. Default tooltip (block name) is all we show; no
# custom provider. Multi-loader; we currently wire NeoForge only.
jade_neoforge_version = 15.10.5+neoforge

# Patchouli — Vazkii's guidebook mod. NeoForge-only for now. We pull from
# CurseMaven; the file id is the version identifier. Find updated versions
# at https://www.curseforge.com/minecraft/mc-mods/patchouli/files (note the
# file id from the URL).
patchouli_neoforge_file_id = 7730942
